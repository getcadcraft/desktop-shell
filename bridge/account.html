<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- The shell's sign-in window (docs/0.4-PART2.md C.2): shows the short code large while the person approves it on
     getcadcraft.com/device. Talks only to window.cadcraftDesktop.account; never sees the token. Words: lang/<locale>.json
     (keys desktop.account.*, desktop.reason.*) through i18n.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="desktop.account.title">Sign in to getcadcraft.com</title>
<script src="i18n.js"></script>
<style>
  :root { --sheet: #fbfaf7; --ink: #1d1f24; --ink-2: #5a5f6a; --line: #c9c6bd; --action: #b3122e; --on-action: #fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --sheet: #15181d; --ink: #e8e6e1; --ink-2: #a3a7b0; --line: #3a3f48; --action: #ff6b81; --on-action: #15181d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sheet); color: var(--ink); font: 1rem/1.5 system-ui, "Segoe UI", sans-serif; }
  main { padding: 1.5rem; display: grid; gap: 1rem; }
  section { display: grid; gap: .85rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--ink-2); font-size: .9rem; }
  .code { font: 700 2.4rem/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; text-align: center;
          border: 2px solid var(--ink); border-radius: 2px; padding: .75rem; user-select: all; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 2px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
  button:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .note { border-left: 4px solid var(--action); padding: .5rem .75rem; }
  [hidden] { display: none !important; }
  /* Phones (0.5 PH.4): one column, the code never past the edge (it shrinks with the screen), touch-sized buttons. */
  @media (max-width: 599px), (max-height: 520px) and (max-width: 1000px) {
    main { padding: 1rem; }
    .code { font-size: clamp(1.5rem, 9vw, 2.4rem); letter-spacing: .06em; padding: .6rem .4rem; overflow-wrap: anywhere; }
    button { min-height: 2.75rem; }
    .row > button { flex: 1 1 10rem; }
    .note { overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<main id="main">
  <section data-view="signed_out" hidden>
    <h1 data-t="desktop.account.title"></h1>
    <p data-t="desktop.account.signed_out.text"></p>
    <p class="note" data-reason hidden></p>
    <div class="row"><button class="primary" data-act="sign-in" data-t="desktop.account.get_code"></button><button data-act="close" data-t="desktop.account.not_now"></button></div>
  </section>

  <section data-view="waiting" hidden>
    <h1 data-t="desktop.account.waiting.title"></h1>
    <p data-t="desktop.account.waiting.text"></p>
    <p class="code" data-code aria-live="polite"></p>
    <p class="muted"><span data-t="desktop.account.waiting.own"></span> <span data-left></span></p>
    <div class="row"><button class="primary" data-act="open" data-t="desktop.account.open_device"></button><button data-act="cancel" data-t="desktop.account.cancel"></button></div>
  </section>

  <section data-view="signed_in" hidden>
    <h1 data-t="desktop.account.signed_in.title"></h1>
    <p data-who></p>
    <p class="muted" data-t="desktop.account.signed_in.text"></p>
    <div class="row"><button data-act="sign-out" data-t="desktop.account.sign_out"></button><button class="primary" data-act="close" data-t="desktop.account.done"></button></div>
  </section>
</main>
<script>
window.ccShellI18n.ready.then(({ t }) => {
  const D = window.cadcraftDesktop;
  if (!D || !D.account) { document.body.textContent = t('desktop.account.only_desktop'); return; }
  // A reason the shell gives a code for is said in the person's language; anything else as the shell/website worded it.
  const REASONS = ['throttled', 'expired', 'denied', 'revoked', 'offline_signout', 'keystore'];
  const said = (s) => (s.reason && REASONS.includes(s.reason) ? t('desktop.reason.' + s.reason) : s.message || '');
  const $ = (s) => document.querySelector(s);
  let st = null, timer = 0;
  const render = (s) => {
    st = s;
    document.querySelectorAll('[data-view]').forEach((v) => { v.hidden = v.dataset.view !== s.state; });
    const r = $('[data-reason]');
    r.textContent = said(s);
    r.hidden = !r.textContent;
    if (s.state === 'waiting') $('[data-code]').textContent = s.code || '';
    if (s.state === 'signed_in') {
      const u = s.user || {};
      $('[data-who]').textContent = u.name ? `${u.name} (${u.email})` : (u.email || t('desktop.account.signed_in.who'));
    }
    clearInterval(timer);
    if (s.state === 'waiting' && s.expiresAt) {
      const tick = () => {
        const left = Math.max(0, s.expiresAt - Math.floor(Date.now() / 1000));
        $('[data-left]').textContent = left > 0 ? t('desktop.account.waiting.left', { n: Math.ceil(left / 60) }) : t('desktop.account.waiting.out');
      };
      tick(); timer = setInterval(tick, 15000);
    }
    const f = document.querySelector(`[data-view="${s.state}"] button.primary`);
    if (f) f.focus();
  };
  D.account.onChange(render);
  D.account.status().then(render);
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    try {
      if (act === 'sign-in') render(await D.account.signIn());
      else if (act === 'cancel') render(await D.account.cancel());
      else if (act === 'sign-out') render(await D.account.signOut());
      else if (act === 'open') await D.account.openDevicePage();
      else if (act === 'close') D.account.closeWindow();
    } catch (err) {
      render({ state: 'signed_out', message: err.message.replace(/^[a-z_]+: /, '') });
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') D.account.closeWindow(); });
});
</script>
</body>
</html>
