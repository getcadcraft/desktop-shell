# SPDX-License-Identifier: Apache-2.0
# Linux (0.7 D7.57): the shell's tests on a real Linux with WebKitGTK, on every push and pull request, and a release-mode
# compile check. The packages people download (.deb, AppImage) are made by stores/linux/build.mjs in the site's checkout
# (desktop entry with every file type, MIME and AppStream files, the updater's AppImage signature); this job only keeps the
# shell itself building and tested on Linux, including the black-window guard (src-tauri/src/linux.rs).
name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (WebKitGTK 4.1, GTK 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libsoup-3.0-dev pkg-config
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Release-mode compile (the feature set Linux packages use)
        working-directory: src-tauri
        run: cargo build --release
      - name: Node tests (no webview needed)
        run: |
          node test/bridge.test.mjs
          node test/feed.test.mjs
          node test/lang.test.mjs
          node test/webview2.test.mjs
          node test/apple.test.mjs
      - name: License gate (shipped crates)
        run: node licenses.mjs --target x86_64-unknown-linux-gnu
